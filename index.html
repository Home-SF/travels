<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travels — Family Trip Archive</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

  <div id="nav-root"></div>

  <main class="page-wrap">
    <div class="section-head">
      <span class="section-kicker">Family Travels</span>
      <h1>All Trips</h1>
    </div>

    <div id="trips-root">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading trips…</p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { fetchAllTrips, renderNav, renderFooter, renderEmpty,
             escHtml, fmtDateRange, renderCityPills } from './assets/app.js';

    // Nav + footer
    document.getElementById('nav-root').innerHTML = renderNav(null, null, 'home');
    document.getElementById('footer-root').innerHTML = renderFooter();

    function renderTripCard(trip) {
      const status = trip.status || 'planning';
      const statusLabel = { planning: 'Planning', active: 'Active', complete: 'Complete' }[status] || status;
      const cities = (trip.cities || []);
      const travelers = (trip.travelers || []).length;

      const dateRange = fmtDateRange(trip.dates?.start, trip.dates?.end);

      return `
        <a class="trip-card" href="trip.html?id=${encodeURIComponent(trip.id)}">
          <span class="trip-card__status ${status}">${statusLabel}</span>
          <div class="trip-card__title">${escHtml(trip.title)}</div>
          ${trip.subtitle ? `<div class="trip-card__dates">${escHtml(trip.subtitle)}</div>` : ''}
          ${dateRange ? `<div class="trip-card__dates">${dateRange}</div>` : ''}
          <div class="trip-card__cities">${renderCityPills(cities)}</div>
          ${travelers ? `<div class="trip-card__travelers">${travelers} traveler${travelers !== 1 ? 's' : ''}</div>` : ''}
        </a>
      `;
    }

    // Load trips
    (async () => {
      try {
        const trips = await fetchAllTrips();
        const root = document.getElementById('trips-root');

        if (!trips.length) {
          root.innerHTML = renderEmpty('No trips yet.');
          return;
        }

        // Active trip pinned first, then reverse chronological by start date
        trips.sort((a, b) => {
          if (a.status === 'active') return -1;
          if (b.status === 'active') return 1;
          const aDate = a.dates?.start || '';
          const bDate = b.dates?.start || '';
          return bDate.localeCompare(aDate);
        });

        root.innerHTML = `<div class="trip-grid">${trips.map(renderTripCard).join('')}</div>`;
      } catch (err) {
        console.error(err);
        document.getElementById('trips-root').innerHTML =
          `<div class="empty-state"><p>Failed to load trips. Check Firebase config.</p></div>`;
      }
    })();
  </script>
</body>
</html>
