<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map — Travels</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map-container {
      height: 65vh;
      min-height: 400px;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 1rem;
    }
    #map { height: 100%; }
    .map-legend {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--ink-soft);
    }
    .legend-item { display: flex; align-items: center; gap: 0.3rem; }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div id="nav-root"></div>

  <main class="page-wrap">
    <div class="section-head">
      <span class="section-kicker" id="kicker">Map</span>
      <h1>Location Map</h1>
    </div>

    <div id="filters-root"></div>
    <div id="map-container"><div id="map"></div></div>
    <div class="map-legend" id="legend"></div>
  </main>

  <div id="footer-root"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { db } from './assets/firebase-config.js';
    import { getParam, fetchTrip, renderNav, renderFooter, escHtml } from './assets/app.js';
    import { collection, query, where, getDocs }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const tripId = getParam('trip');
    document.getElementById('footer-root').innerHTML = renderFooter();

    try {
      if (!tripId) {
        document.getElementById('nav-root').innerHTML = renderNav();
        throw new Error('no tripId');
      }

      const trip = await fetchTrip(tripId);
      if (!trip) {
        document.getElementById('nav-root').innerHTML = renderNav();
        throw new Error('trip not found');
      }

      document.title = `Map — ${trip.title}`;
      document.getElementById('nav-root').innerHTML = renderNav(tripId, trip.title, 'map');
      document.getElementById('kicker').innerHTML =
        `<a href="trip.html?id=${encodeURIComponent(tripId)}" style="color:inherit">${escHtml(trip.title)}</a>`;

      const [trackSnap, checkinSnap] = await Promise.all([
        getDocs(query(collection(db, 'tracks'), where('tripId', '==', tripId))),
        getDocs(query(collection(db, 'checkins'), where('tripId', '==', tripId))),
      ]);
      const tracks   = trackSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      const checkins = checkinSnap.docs.map(d => d.data());

      const travelers = (trip.travelers || []).filter(t => t.key && t.name && t.color);
      const cities = trip.cities || [];

      const cityColors = {
        paris: '#E1512B', london: '#1D4E89', toronto: '#1B7A5C',
        tokyo: '#C0392B', 'kuala-lumpur': '#8E44AD', singapore: '#16A085',
      };

      // Traveler lookups
      const colorByKey  = {};
      const colorByName = {};
      const nameByKey   = {};
      for (const t of travelers) {
        colorByKey[t.key]   = t.color;
        colorByName[t.name] = t.color;
        nameByKey[t.key]    = t.name;
      }
      const keyForName = name => travelers.find(t => t.name === name)?.key ?? null;

      // Init map
      const map = L.map('map');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors', maxZoom: 18,
      }).addTo(map);

      const bounds = [];

      // City markers — always on
      for (const city of cities) {
        if (!city.coords?.lat) continue;
        const { lat, lon } = city.coords;
        bounds.push([lat, lon]);
        const color = cityColors[city.id] || '#888';
        L.circleMarker([lat, lon], {
          radius: 10, color, fillColor: color, fillOpacity: 0.8, weight: 2,
        }).addTo(map).bindPopup(`<strong>${escHtml(city.name)}</strong>`);
      }

      // One LayerGroup per traveler key
      const layers = {};
      for (const t of travelers) {
        layers[t.key] = L.layerGroup().addTo(map);
      }
      const fallbackLayer = L.layerGroup().addTo(map);

      // GPS tracks
      for (const track of tracks) {
        const pts = track.points || [];
        if (!pts.length) continue;
        const color = colorByKey[track.id] || '#888';
        const lg = layers[track.id] || fallbackLayer;
        const latLngs = pts.map(p => [p.lat, p.lon]);
        latLngs.forEach(ll => bounds.push(ll));
        L.polyline(latLngs, { color, weight: 2.5, opacity: 0.7 }).addTo(lg);
        const step = Math.max(1, Math.floor(pts.length / 20));
        pts.filter((_, i) => i % step === 0).forEach(pt => {
          L.circleMarker([pt.lat, pt.lon], {
            radius: 4, color, fillColor: color, fillOpacity: 0.6, weight: 1,
          }).addTo(lg).bindPopup(
            `${escHtml(nameByKey[track.id] || track.id)}<br>${pt.timestamp ? new Date(pt.timestamp.seconds*1000).toLocaleString() : ''}`
          );
        });
      }

      // Check-in markers
      for (const c of checkins) {
        if (!c.lat || !c.lon) continue;
        const color = colorByName[c.person] || colorByKey[c.personKey] || '#888';
        const key = keyForName(c.person) || c.personKey;
        const lg = (key && layers[key]) ? layers[key] : fallbackLayer;
        const ts = c.timestamp?.toDate ? c.timestamp.toDate() : null;
        const when = ts ? ts.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
        bounds.push([c.lat, c.lon]);
        L.circleMarker([c.lat, c.lon], {
          radius: 6, color, fillColor: color, fillOpacity: 0.75, weight: 1.5,
        }).addTo(lg).bindPopup(
          `<strong>${escHtml(c.person || '')}</strong><br>${escHtml(c.placeName || '')}<br><span style="font-size:0.8em;color:#888">${escHtml(when)}</span>`
        );
      }

      if (bounds.length) {
        map.fitBounds(L.latLngBounds(bounds), { padding: [40, 40] });
      } else {
        map.setView([48.8566, 2.3522], 5);
      }

      // Filter bar
      if (travelers.length >= 2) {
        let activeKey = 'all';

        const renderFilters = () => {
          document.getElementById('filters-root').innerHTML = `
            <div class="filter-bar" style="margin-top:1rem">
              <button class="filter-btn ${activeKey === 'all' ? 'active' : ''}" data-fkey="all">All</button>
              ${travelers.map(t => `
                <button class="filter-btn ${activeKey === t.key ? 'active' : ''}" data-fkey="${escHtml(t.key)}"
                  style="${activeKey === t.key ? `background:${escHtml(t.color)};border-color:${escHtml(t.color)};color:#fff` : ''}">
                  ${escHtml(t.name)}
                </button>
              `).join('')}
            </div>
          `;
          document.querySelectorAll('.filter-btn[data-fkey]').forEach(btn => {
            btn.addEventListener('click', () => {
              activeKey = btn.dataset.fkey;
              for (const t of travelers) {
                if (activeKey === 'all' || activeKey === t.key) {
                  map.addLayer(layers[t.key]);
                } else {
                  map.removeLayer(layers[t.key]);
                }
              }
              renderFilters();
            });
          });
        };

        renderFilters();
      }

      // Legend
      const legendItems = [
        ...cities.map(c => ({ label: c.name, color: cityColors[c.id] || '#888' })),
        ...travelers.map(t => ({ label: t.name, color: t.color })),
      ];
      document.getElementById('legend').innerHTML = legendItems.map(item => `
        <span class="legend-item">
          <span class="legend-dot" style="background:${escHtml(item.color)}"></span>
          ${escHtml(item.label)}
        </span>
      `).join('');

    } catch (err) {
      console.error('Map error:', err);
    }
  </script>
</body>
</html>
