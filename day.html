<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day — Travels</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .day-hero {
      padding: 1.5rem 0 1.25rem;
      border-bottom: 1.5px solid var(--rule);
      margin-bottom: 2rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .day-nav-arrows {
      display: flex;
      gap: 0.5rem;
    }
    .day-nav-arrow {
      font-size: 0.82rem;
      padding: 0.3rem 0.75rem;
      border: 1.5px solid var(--rule);
      border-radius: 99px;
      color: var(--navy);
      text-decoration: none;
      transition: all 0.15s;
    }
    .day-nav-arrow:hover {
      background: var(--bg-raised);
      text-decoration: none;
    }
    .day-nav-arrow.disabled {
      color: var(--ink-faint);
      pointer-events: none;
    }
    .day-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }
    .day-section-head {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 2rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--rule);
    }
    .day-restaurant {
      background: var(--bg-raised);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 0.9rem 1.1rem;
      margin-bottom: 0.75rem;
    }
    .day-restaurant.reserved { border-left: 3px solid var(--brass-dark); }

    /* ── Day upload panel ─────────────────────────────────── */
    .day-upload-panel {
      margin-top: 2.5rem;
      padding-top: 0.5rem;
    }
    .upload-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: none;
      border: none;
      border-bottom: 1px solid var(--rule);
      padding: 0 0 0.4rem;
      margin-bottom: 1.25rem;
      width: 100%;
      text-align: left;
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
    }
    .upload-toggle:hover { color: var(--navy); }
    .upload-toggle-chevron { transition: transform 0.2s; font-style: normal; }
    .upload-toggle.open .upload-toggle-chevron { transform: rotate(90deg); }
    #day-upload-body { display: none; }
    #day-upload-body.open { display: block; }

    /* Auth */
    .day-auth-form {
      max-width: 320px;
      background: var(--bg-raised);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .day-field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.85rem; }
    .day-field label { font-size: 0.78rem; color: var(--ink-soft); font-weight: 500; }
    .day-field input, .day-field select {
      padding: 0.45rem 0.7rem;
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--ink);
      font-size: 0.88rem;
      font-family: inherit;
    }
    .day-field input:focus, .day-field select:focus { outline: none; border-color: var(--navy); }
    .day-auth-error { color: #c0392b; font-size: 0.8rem; margin-top: 0.4rem; }

    /* Upload form */
    .day-upload-form {
      background: var(--bg-raised);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .day-user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--ink-soft);
      margin-bottom: 1rem;
    }
    .day-sign-out {
      font-size: 0.75rem;
      padding: 0.15rem 0.6rem;
      border: 1.5px solid var(--rule);
      border-radius: 99px;
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
    }
    .day-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      margin-bottom: 0.85rem;
    }
    @media (max-width: 500px) { .day-form-row { grid-template-columns: 1fr; } }
    .day-file-drop {
      border: 2px dashed var(--rule);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      margin-bottom: 0.85rem;
    }
    .day-file-drop:hover, .day-file-drop.drag-over {
      border-color: var(--navy);
      background: var(--bg);
    }
    .day-file-drop input[type=file] { display: none; }
    .day-preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .day-preview-item {
      position: relative;
      border-radius: calc(var(--radius) - 2px);
      overflow: hidden;
      aspect-ratio: 1;
      background: var(--bg);
      border: 1.5px solid var(--rule);
    }
    .day-preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .day-preview-remove {
      position: absolute;
      top: 2px; right: 2px;
      width: 18px; height: 18px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 0.7rem;
      line-height: 18px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .day-preview-date {
      position: absolute;
      top: 2px; left: 2px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.5rem;
      padding: 1px 3px;
      border-radius: 3px;
      white-space: nowrap;
    }
    .day-preview-name {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-size: 0.55rem;
      padding: 2px 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .day-btn-primary {
      padding: 0.55rem 1.1rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .day-btn-primary:hover { opacity: 0.88; }
    .day-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .day-btn-secondary {
      padding: 0.5rem 1rem;
      background: var(--bg);
      color: var(--ink);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      font-size: 0.82rem;
      font-family: inherit;
      cursor: pointer;
    }
    .day-btn-secondary:hover { background: var(--bg-raised); }
    .day-exif-note { font-size: 0.75rem; color: var(--ink-faint); margin-bottom: 0.75rem; }

    /* Upload log */
    .day-upload-log { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.75rem; }
    .day-upload-row {
      background: var(--bg-raised);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      padding: 0.5rem 0.75rem;
      font-size: 0.78rem;
    }
    .day-upload-row__name { font-weight: 500; margin-bottom: 0.2rem; }
    .day-upload-row__bar-wrap {
      height: 3px;
      background: var(--rule);
      border-radius: 99px;
      overflow: hidden;
    }
    .day-upload-row__bar {
      height: 100%;
      background: var(--navy);
      border-radius: 99px;
      width: 0%;
      transition: width 0.2s;
    }
    .day-upload-row__status { margin-top: 0.2rem; color: var(--ink-faint); }
    .day-upload-row.done .day-upload-row__bar { background: #16a34a; }
    .day-upload-row.error .day-upload-row__bar { background: #c0392b; }

    /* ── Day photos section ───────────────────────────────────── */
    .day-photos-section {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--rule);
    }
    .day-photos-head {
      font-family: var(--display);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .day-photos-head a {
      font-family: var(--body, inherit);
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--navy);
    }
    .day-photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.5rem;
    }
    .day-photo-item {
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1.5px solid var(--rule);
      background: var(--bg-raised);
    }
    .day-photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s;
    }
    .day-photo-item:hover img { transform: scale(1.04); }

    /* Lightbox */
    .day-lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 300;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
    }
    .day-lightbox.open { display: flex; }
    .day-lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius);
    }
    .day-lightbox-caption {
      color: #fff;
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .day-lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.75rem;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div id="nav-root"></div>

  <main class="page-wrap">
    <div id="day-root">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading day…</p>
      </div>
    </div>
    <div id="day-photos-root"></div>
    <div id="day-upload-root"></div>
  </main>

  <!-- Day lightbox -->
  <div class="day-lightbox" id="day-lightbox">
    <button class="day-lightbox-close" id="day-lb-close" aria-label="Close">×</button>
    <img id="day-lb-img" src="" alt="" />
    <div class="day-lightbox-caption" id="day-lb-caption"></div>
  </div>

  <div id="footer-root"></div>

  <script type="module">
    import { getParam, fetchTrip, fetchDay, fetchDays, fetchRestaurants,
             renderNav, renderFooter, escHtml, fmtDate } from './assets/app.js';
    import { app, db } from './assets/firebase-config.js';
    import {
      getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import {
      getStorage, ref as storageRef, uploadBytesResumable, getDownloadURL
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
    import {
      collection, addDoc, serverTimestamp, query, where, getDocs
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    import exifr from 'https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.esm.js';

    const TRIP_ID = 'paris-london-2026';
    const tripId  = getParam('trip');
    const date    = getParam('date');
    document.getElementById('footer-root').innerHTML = renderFooter();

    // ── Day rendering ──────────────────────────────────────────

    function renderDay(trip, day, prev, next, dayRests) {
      const events = (day.events || []);

      const prevLink = prev
        ? `<a class="day-nav-arrow" href="day.html?trip=${encodeURIComponent(tripId)}&date=${prev}">← Previous</a>`
        : `<span class="day-nav-arrow disabled">← Previous</span>`;
      const nextLink = next
        ? `<a class="day-nav-arrow" href="day.html?trip=${encodeURIComponent(trip.id)}&date=${next}">Next →</a>`
        : `<span class="day-nav-arrow disabled">Next →</span>`;

      const metaParts = [];
      if (day.hotel) metaParts.push(`🏨 ${escHtml(day.hotel)}`);
      if (day.sunsetTime) metaParts.push(`🌇 Sunset ${escHtml(day.sunsetTime)}`);
      if (day.publicHoliday) metaParts.push(`📅 ${escHtml(day.publicHoliday)}`);

      const eventsHtml = events.length ? `
        <div class="events-timeline">
          ${events.map(ev => `
            <div class="event-row">
              <div class="event-time">${escHtml(ev.time || '')}</div>
              <div class="event-dot"></div>
              <div class="event-content">
                <div class="event-title">${escHtml(ev.title || '')}</div>
                ${ev.note ? `<div class="event-note">${escHtml(ev.note)}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      ` : `<div class="empty-state" style="padding:1.5rem 0">No events scheduled.</div>`;

      const restsHtml = dayRests.length ? `
        <div class="day-section-head">Dining</div>
        ${dayRests.map(r => `
          <div class="day-restaurant ${r.reserved ? 'reserved' : ''}">
            <div style="font-family:var(--display);font-weight:700;font-size:1rem">${escHtml(r.name)}</div>
            <div style="font-size:0.8rem;color:var(--ink-soft);margin-top:0.15rem">${escHtml(r.address)}</div>
            ${r.visitNote ? `<div style="font-size:0.78rem;color:var(--brass-dark);margin-top:0.3rem">${escHtml(r.visitNote)}</div>` : ''}
            ${renderRestLinks(r.links)}
          </div>
        `).join('')}
      ` : '';

      return `
        <div class="day-hero">
          <div>
            <span class="section-kicker">
              <a href="trip.html?id=${encodeURIComponent(trip.id)}" style="color:inherit">${escHtml(trip.title)}</a>
            </span>
            <h1 style="font-family:var(--display);font-size:2rem;font-weight:800;line-height:1.05">
              ${escHtml(day.weekday || '')}, ${escHtml(day.displayDate || day.date)}
            </h1>
            ${day.kicker ? `<p style="color:var(--ink-soft);margin-top:0.2rem">${escHtml(day.kicker)}</p>` : ''}
            ${metaParts.length ? `<div class="day-meta">${metaParts.map(p => `<span>${p}</span>`).join('')}</div>` : ''}
          </div>
          <div class="day-nav-arrows">${prevLink}${nextLink}</div>
        </div>

        ${eventsHtml}
        ${restsHtml}
      `;
    }

    function renderRestLinks(links = {}) {
      const entries = Object.entries(links);
      if (!entries.length) return '';
      return `<div class="rest-links" style="margin-top:0.5rem">
        ${entries.map(([k, v]) => {
          const url = typeof v === 'string' ? v : v?.url;
          const label = { website: 'Website', menu: 'Menu', reserve: 'Reserve',
                          michelin: 'Michelin', infatuation: 'Infatuation',
                          instagram: 'Instagram' }[k] || k;
          return url ? `<a class="rest-link" href="${escHtml(url)}" target="_blank" rel="noopener">${label} →</a>` : '';
        }).join('')}
      </div>`;
    }

    // ── EXIF extraction ────────────────────────────────────────

    async function extractExifDate(file) {
      try {
        const data = await exifr.parse(file, ['DateTimeOriginal']);
        if (data?.DateTimeOriginal instanceof Date) {
          const d = data.DateTimeOriginal;
          return [
            d.getFullYear(),
            String(d.getMonth() + 1).padStart(2, '0'),
            String(d.getDate()).padStart(2, '0'),
          ].join('-');
        }
      } catch (_) {}
      return null;
    }

    // ── Photo upload section ───────────────────────────────────

    function initUploadSection(trip, day) {
      const auth    = getAuth(app);
      const storage = getStorage(app);

      // Infer city from day data or date range (Paris → London)
      const dayCity = day.city
        || (day.date >= '2026-08-15' ? 'london' : day.date >= '2026-08-07' ? 'paris' : 'toronto');

      const PERSONS = [
        'Michael Lee', 'Uwen Kok', 'Carl Kurbat',
        'Amanda Lee', 'Norman Lee', 'Megan Lee', 'Brodie Demain',
      ];

      const CITIES = { toronto: 'Toronto', paris: 'Paris', london: 'London' };

      const root = document.getElementById('day-upload-root');
      root.innerHTML = `
        <div class="day-upload-panel">
          <button class="upload-toggle" id="upload-toggle" aria-expanded="false">
            <i class="upload-toggle-chevron">▶</i> Upload Photos
          </button>
          <div id="day-upload-body">
            <div id="day-auth-section"></div>
            <div id="day-upload-section" style="display:none"></div>
          </div>
        </div>
      `;

      // Toggle open/close
      const toggleBtn  = document.getElementById('upload-toggle');
      const uploadBody = document.getElementById('day-upload-body');
      toggleBtn.addEventListener('click', () => {
        const isOpen = uploadBody.classList.toggle('open');
        toggleBtn.classList.toggle('open', isOpen);
        toggleBtn.setAttribute('aria-expanded', String(isOpen));
      });

      // Render auth form
      function renderAuth(errorMsg = '') {
        document.getElementById('day-auth-section').innerHTML = `
          <div class="day-auth-form">
            <div class="day-field">
              <label>Email</label>
              <input type="email" id="day-email" autocomplete="email" placeholder="you@example.com" />
            </div>
            <div class="day-field">
              <label>Password</label>
              <input type="password" id="day-password" autocomplete="current-password" placeholder="••••••••" />
            </div>
            <button class="day-btn-primary" id="day-sign-in-btn">Sign in to upload</button>
            ${errorMsg ? `<div class="day-auth-error">${escHtml(errorMsg)}</div>` : ''}
          </div>
        `;
        document.getElementById('day-sign-in-btn').addEventListener('click', async () => {
          const email = document.getElementById('day-email').value.trim();
          const pass  = document.getElementById('day-password').value;
          try {
            await signInWithEmailAndPassword(auth, email, pass);
          } catch (e) {
            renderAuth(e.message.replace('Firebase: ', ''));
          }
        });
        document.getElementById('day-password').addEventListener('keydown', e => {
          if (e.key === 'Enter') document.getElementById('day-sign-in-btn').click();
        });
      }

      // Render upload form
      function renderUploadForm(userEmail) {
        document.getElementById('day-auth-section').innerHTML = '';
        document.getElementById('day-upload-section').style.display = 'block';
        document.getElementById('day-upload-section').innerHTML = `
          <div class="day-upload-form">
            <div class="day-user-bar">
              <span>${escHtml(userEmail)}</span>
              <button class="day-sign-out" id="day-sign-out-btn">Sign out</button>
            </div>
            <div class="day-form-row">
              <div class="day-field">
                <label>Person</label>
                <select id="day-sel-person">
                  ${PERSONS.map(p => `<option value="${escHtml(p)}">${escHtml(p)}</option>`).join('')}
                </select>
              </div>
              <div class="day-field">
                <label>City</label>
                <select id="day-sel-city">
                  ${Object.entries(CITIES).map(([v, l]) =>
                    `<option value="${escHtml(v)}" ${v === dayCity ? 'selected' : ''}>${escHtml(l)}</option>`
                  ).join('')}
                </select>
              </div>
            </div>
            <p class="day-exif-note">📷 Shot date is read from EXIF automatically. These are tagged to <strong>${escHtml(day.displayDate || day.date)}</strong> as fallback.</p>
            <label class="day-file-drop" id="day-file-drop">
              <input type="file" id="day-file-input" multiple accept="image/*" />
              <div>📷 Click or drag photos here</div>
              <div style="font-size:0.72rem;margin-top:0.25rem;color:var(--ink-faint)">JPG, PNG, HEIC — multiple OK</div>
            </label>
            <div class="day-preview-grid" id="day-preview-grid"></div>
            <button class="day-btn-primary" id="day-upload-btn" disabled>Upload photos</button>
            <div class="day-upload-log" id="day-upload-log"></div>
          </div>
        `;

        document.getElementById('day-sign-out-btn').addEventListener('click', () => signOut(auth));
        initFilePickerAndUpload(day.date);
      }

      onAuthStateChanged(auth, user => {
        if (user) {
          renderUploadForm(user.email);
        } else {
          document.getElementById('day-upload-section').style.display = 'none';
          renderAuth();
        }
      });
    }

    // ── File picking & upload (day page) ──────────────────────

    function initFilePickerAndUpload(dayDate) {
      // { file: File, exifDate: string|null|undefined }
      let selectedFiles = [];

      const fileInput   = document.getElementById('day-file-input');
      const fileDrop    = document.getElementById('day-file-drop');
      const previewGrid = document.getElementById('day-preview-grid');
      const uploadBtn   = document.getElementById('day-upload-btn');
      const auth        = getAuth(app);
      const storage     = getStorage(app);

      fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
      fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
      fileDrop.addEventListener('drop', e => {
        e.preventDefault();
        fileDrop.classList.remove('drag-over');
        addFiles([...e.dataTransfer.files].filter(f => f.type.startsWith('image/')));
      });
      fileInput.addEventListener('change', () => {
        addFiles([...fileInput.files]);
        fileInput.value = '';
      });

      function addFiles(files) {
        for (const f of files) {
          if (!selectedFiles.find(x => x.file.name === f.name && x.file.size === f.size)) {
            const item = { file: f, exifDate: undefined };
            selectedFiles.push(item);
            extractExifDate(f).then(d => { item.exifDate = d; renderPreviews(); });
          }
        }
        renderPreviews();
      }

      function renderPreviews() {
        previewGrid.innerHTML = '';
        for (let i = 0; i < selectedFiles.length; i++) {
          const { file, exifDate } = selectedFiles[i];
          const url = URL.createObjectURL(file);
          let badge = '';
          if (exifDate === undefined) badge = `<div class="day-preview-date">⏳</div>`;
          else if (exifDate) badge = `<div class="day-preview-date">📷 ${escHtml(exifDate)}</div>`;
          const div = document.createElement('div');
          div.className = 'day-preview-item';
          div.innerHTML = `
            <img src="${url}" />
            ${badge}
            <button class="day-preview-remove" data-idx="${i}">×</button>
            <div class="day-preview-name">${escHtml(file.name)}</div>
          `;
          previewGrid.appendChild(div);
        }
        previewGrid.querySelectorAll('.day-preview-remove').forEach(btn => {
          btn.addEventListener('click', () => {
            selectedFiles.splice(+btn.dataset.idx, 1);
            renderPreviews();
          });
        });
        uploadBtn.disabled = selectedFiles.length === 0;
      }

      uploadBtn.addEventListener('click', async () => {
        if (!selectedFiles.length) return;
        const person  = document.getElementById('day-sel-person').value;
        const city    = document.getElementById('day-sel-city').value;
        const log     = document.getElementById('day-upload-log');
        uploadBtn.disabled = true;

        const filesToUpload = [...selectedFiles];
        selectedFiles = [];
        renderPreviews();

        for (const item of filesToUpload) {
          const { file } = item;
          const photoDate = item.exifDate || dayDate; // EXIF date or this day's date

          const rowId = `drow-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          log.insertAdjacentHTML('afterbegin', `
            <div class="day-upload-row" id="${rowId}">
              <div class="day-upload-row__name">${escHtml(file.name)}${item.exifDate ? ` <span style="font-weight:400;color:var(--ink-faint)">(📷 ${escHtml(item.exifDate)})</span>` : ''}</div>
              <div class="day-upload-row__bar-wrap"><div class="day-upload-row__bar" id="bar-${rowId}"></div></div>
              <div class="day-upload-row__status" id="st-${rowId}">Uploading…</div>
            </div>
          `);

          try {
            const path = `photos/${TRIP_ID}/${photoDate}_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
            const sRef = storageRef(storage, path);
            const task = uploadBytesResumable(sRef, file, { contentType: file.type, customMetadata: { person } });

            await new Promise((resolve, reject) => {
              task.on('state_changed',
                snap => {
                  const pct = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
                  document.getElementById(`bar-${rowId}`).style.width = pct + '%';
                  document.getElementById(`st-${rowId}`).textContent  = `${pct}%`;
                },
                reject, resolve,
              );
            });

            const url = await getDownloadURL(sRef);
            await addDoc(collection(db, 'trips', TRIP_ID, 'photos'), {
              url, thumbnailUrl: url,
              person, city,
              date: photoDate,
              filename: file.name,
              tripId: TRIP_ID,
              uploadedAt: serverTimestamp(),
            });

            document.getElementById(rowId).classList.add('done');
            document.getElementById(`bar-${rowId}`).style.width = '100%';
            document.getElementById(`st-${rowId}`).innerHTML =
              `✓ Done — <a href="photos.html?trip=${TRIP_ID}" target="_blank">View gallery →</a>`;

          } catch (err) {
            document.getElementById(rowId).classList.add('error');
            document.getElementById(`st-${rowId}`).textContent = `Error: ${err.message}`;
            console.error(err);
          }
        }

        uploadBtn.disabled = false;
      });
    }

    // ── Day photo section ─────────────────────────────────────

    // Lightbox wiring (shared across all day photos)
    document.getElementById('day-lb-close').addEventListener('click', () => {
      document.getElementById('day-lightbox').classList.remove('open');
    });
    document.getElementById('day-lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
    });

    function openDayLightbox(photo) {
      document.getElementById('day-lb-img').src = photo.url || photo.thumbnailUrl;
      document.getElementById('day-lb-img').alt = photo.caption || '';
      document.getElementById('day-lb-caption').textContent =
        [photo.caption, photo.person, photo.date].filter(Boolean).join(' · ');
      document.getElementById('day-lightbox').classList.add('open');
    }

    async function renderDayPhotos(tripId, date) {
      const root = document.getElementById('day-photos-root');
      try {
        const snap = await getDocs(
          query(collection(db, 'trips', tripId, 'photos'), where('date', '==', date))
        );
        const dayPhotos = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.uploadedAt?.toMillis?.() ?? 0) - (b.uploadedAt?.toMillis?.() ?? 0));

        if (!dayPhotos.length) return; // no photos yet — show nothing

        root.innerHTML = `
          <div class="day-photos-section">
            <div class="day-photos-head">
              <span>Photos <span style="font-size:0.85rem;font-weight:400;color:var(--ink-soft)">(${dayPhotos.length})</span></span>
              <a href="photos.html?trip=${encodeURIComponent(tripId)}">All photos →</a>
            </div>
            <div class="day-photo-grid" id="day-photo-grid">
              ${dayPhotos.map((p, i) => `
                <div class="day-photo-item" data-idx="${i}">
                  <img src="${escHtml(p.thumbnailUrl || p.url)}" alt="${escHtml(p.caption || '')}" loading="lazy" />
                </div>
              `).join('')}
            </div>
          </div>
        `;

        document.querySelectorAll('#day-photo-grid .day-photo-item').forEach(el => {
          el.addEventListener('click', () => openDayLightbox(dayPhotos[+el.dataset.idx]));
        });
      } catch (err) {
        console.error('Day photos error:', err);
      }
    }

    // ── Main ───────────────────────────────────────────────────

    (async () => {
      if (!tripId || !date) {
        document.getElementById('nav-root').innerHTML = renderNav();
        document.getElementById('day-root').innerHTML =
          `<div class="empty-state"><p>Missing trip or date. <a href="index.html">All trips →</a></p></div>`;
        return;
      }

      try {
        const [trip, day, allDays, restaurants] = await Promise.all([
          fetchTrip(tripId),
          fetchDay(tripId, date),
          fetchDays(tripId),
          fetchRestaurants(tripId, null),
        ]);

        if (!trip || !day) {
          document.getElementById('nav-root').innerHTML = renderNav(tripId);
          document.getElementById('day-root').innerHTML =
            `<div class="empty-state"><p>Day not found. <a href="trip.html?id=${encodeURIComponent(tripId)}">Back to trip →</a></p></div>`;
          return;
        }

        document.title = `${day.displayDate || day.date} — ${trip.title}`;
        document.getElementById('nav-root').innerHTML = renderNav(tripId, trip.title, 'trip');

        const sorted = allDays.map(d => d.date).sort();
        const idx = sorted.indexOf(date);
        const prev = idx > 0 ? sorted[idx - 1] : null;
        const next = idx < sorted.length - 1 ? sorted[idx + 1] : null;

        const dayRests = restaurants.filter(r => r.reservationDate === date);

        document.getElementById('day-root').innerHTML = renderDay(trip, day, prev, next, dayRests);

        // Photos for this day
        renderDayPhotos(tripId, date);

        // Initialize the upload section for this day
        initUploadSection(trip, day);

      } catch (err) {
        console.error(err);
        document.getElementById('day-root').innerHTML =
          `<div class="empty-state"><p>Error loading day.</p></div>`;
      }
    })();
  </script>
</body>
</html>
