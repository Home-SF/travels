<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trip — Travels</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .trip-hero {
      padding: 2rem 0 1.5rem;
      border-bottom: 1.5px solid var(--rule);
      margin-bottom: 2rem;
    }
    .trip-meta {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--ink-soft);
    }
    .trip-meta strong { color: var(--ink); }
    .quick-links {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .quick-link {
      font-size: 0.78rem;
      padding: 0.25rem 0.75rem;
      border: 1.5px solid var(--rule);
      border-radius: 99px;
      color: var(--navy);
      text-decoration: none;
      transition: all 0.15s;
    }
    .quick-link:hover {
      background: var(--bg-raised);
      border-color: var(--rule-strong);
      text-decoration: none;
    }
    .city-section-head {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 800;
      margin: 2.25rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--rule);
      color: var(--ink);
    }
    .city-section-head:first-child { margin-top: 0; }
  </style>
</head>
<body>

  <div id="nav-root"></div>

  <main class="page-wrap">
    <div id="trip-root">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading trip…</p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { getParam, fetchTrip, fetchDays, renderNav, renderFooter,
             escHtml, fmtDate } from './assets/app.js';

    const tripId = getParam('id');
    document.getElementById('footer-root').innerHTML = renderFooter();

    function renderTrip(trip, days) {
      const cities      = trip.cities      || [];
      const cityGroups  = trip.cityGroups  || {};   // { genoa: 'italy', rome: 'italy', … }
      const groupNames  = trip.cityGroupNames || {}; // { italy: 'Italy', … }

      // Resolve a day's city to its display group key (country or self)
      function groupKey(dayCity) {
        if (!dayCity || dayCity === 'travel') return 'travel';
        return cityGroups[dayCity] || dayCity;
      }

      // Resolve display name: groupNames → trip.cities → raw key
      function groupDisplayName(key) {
        if (groupNames[key]) return groupNames[key];
        const cityObj = cities.find(c => c.id === key);
        return cityObj ? cityObj.name : key;
      }

      let sectionsHtml;
      if (!days.length) {
        sectionsHtml = `<div class="empty-state" style="padding:1rem">No days scheduled.</div>`;
      } else {
        // Group consecutive days by their resolved group key
        const groups = [];
        for (const day of days) {
          const gk = groupKey(day.city);
          if (!groups.length || groups[groups.length - 1].key !== gk) {
            groups.push({ key: gk, days: [day] });
          } else {
            groups[groups.length - 1].days.push(day);
          }
        }

        sectionsHtml = groups.map(g => {
          const cardsHtml = `<div class="days-grid">${g.days.map(d => renderDayCard(d, tripId)).join('')}</div>`;
          if (g.key === 'travel') return cardsHtml; // no header for travel days
          return `<div class="city-section-head">${escHtml(groupDisplayName(g.key))}</div>${cardsHtml}`;
        }).join('');
      }

      // Quick links — use group names if cityGroups present, else individual cities
      let cityLinksHtml;
      if (Object.keys(cityGroups).length) {
        // Deduplicated group keys in order of first appearance
        const seen = new Set();
        const orderedGroups = [];
        for (const cityId of Object.keys(cityGroups)) {
          const gk = cityGroups[cityId];
          if (!seen.has(gk)) { seen.add(gk); orderedGroups.push(gk); }
        }
        cityLinksHtml = orderedGroups.map(gk => {
          const label = groupDisplayName(gk);
          return `
            <a class="quick-link" href="restaurants.html?trip=${encodeURIComponent(tripId)}&city=${encodeURIComponent(gk)}">
              ${escHtml(label)} Dining →
            </a>
            <a class="quick-link" href="activities.html?trip=${encodeURIComponent(tripId)}&city=${encodeURIComponent(gk)}">
              ${escHtml(label)} Activities →
            </a>
          `;
        }).join('');
      } else {
        cityLinksHtml = cities.map(city => `
          <a class="quick-link" href="restaurants.html?trip=${encodeURIComponent(tripId)}&city=${city.id}">
            ${escHtml(city.name)} Dining →
          </a>
          <a class="quick-link" href="activities.html?trip=${encodeURIComponent(tripId)}&city=${city.id}">
            ${escHtml(city.name)} Activities →
          </a>
        `).join('');
      }

      return `
        <div class="trip-hero">
          <span class="section-kicker">Trip</span>
          <h1 style="font-family:var(--display);font-size:2rem;font-weight:800;line-height:1.05">
            ${escHtml(trip.title)}
          </h1>
          ${trip.subtitle ? `<p style="color:var(--ink-soft);margin-top:0.25rem">${escHtml(trip.subtitle)}</p>` : ''}
          <div class="trip-meta">
            <span><strong>${(trip.travelers||[]).length}</strong> travelers</span>
            <span><strong>${days.length}</strong> days</span>
            <span>Status: <strong>${escHtml(trip.status || '')}</strong></span>
          </div>
          <div class="quick-links" style="margin-top:1rem">
            <a class="quick-link" href="restaurants.html?trip=${encodeURIComponent(tripId)}">All Dining →</a>
            <a class="quick-link" href="activities.html?trip=${encodeURIComponent(tripId)}">All Activities →</a>
            <a class="quick-link" href="photos.html?trip=${encodeURIComponent(tripId)}">Photos →</a>
            <a class="quick-link" href="location-map.html?trip=${encodeURIComponent(tripId)}">Map →</a>
            ${cityLinksHtml}
          </div>
        </div>
        ${sectionsHtml}
      `;
    }

    function renderDayCard(day, tripId) {
      const eventCount = (day.events || []).filter(e => !e.placeholder).length;
      const isTravel = day.isTravel ? 'is-travel' : '';
      const cityClass = day.city || '';
      return `
        <a class="day-card ${isTravel} ${cityClass}"
           href="day.html?trip=${encodeURIComponent(tripId)}&date=${encodeURIComponent(day.date)}">
          <div class="day-card__weekday">${escHtml(day.weekday || '')}</div>
          <div class="day-card__date">${escHtml(day.displayDate || day.date)}</div>
          ${day.kicker ? `<div class="day-card__kicker">${escHtml(day.kicker)}</div>` : ''}
          <div class="day-card__events">${eventCount} event${eventCount !== 1 ? 's' : ''}</div>
        </a>
      `;
    }

    (async () => {
      if (!tripId) {
        document.getElementById('nav-root').innerHTML = renderNav();
        document.getElementById('trip-root').innerHTML =
          `<div class="empty-state"><p>No trip specified. <a href="index.html">All trips →</a></p></div>`;
        return;
      }

      try {
        const [trip, days] = await Promise.all([fetchTrip(tripId), fetchDays(tripId)]);

        if (!trip) {
          document.getElementById('nav-root').innerHTML = renderNav();
          document.getElementById('trip-root').innerHTML =
            `<div class="empty-state"><p>Trip not found. <a href="index.html">All trips →</a></p></div>`;
          return;
        }

        document.title = `${trip.title} — Travels`;
        document.getElementById('nav-root').innerHTML = renderNav(tripId, trip.title, 'trip');
        document.getElementById('trip-root').innerHTML = renderTrip(trip, days);

      } catch (err) {
        console.error(err);
        document.getElementById('trip-root').innerHTML =
          `<div class="empty-state"><p>Error loading trip.</p></div>`;
      }
    })();
  </script>
</body>
</html>
