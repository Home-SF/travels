<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activities — Travels</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

  <div id="nav-root"></div>

  <main class="page-wrap">
    <div class="section-head">
      <span class="section-kicker" id="kicker">Activities</span>
      <h1 id="page-title">Things to Do</h1>
    </div>

    <div id="filters-root"></div>
    <div id="acts-root">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading activities…</p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { getParam, fetchTrip, fetchActivities, renderNav, renderFooter,
             escHtml } from './assets/app.js';

    const tripId    = getParam('trip');
    const cityParam = getParam('city');
    document.getElementById('footer-root').innerHTML = renderFooter();

    // Display names for country-grouped trips (city id → label)
    const COUNTRY_LABELS = { italy: 'Italy', greece: 'Greece', turkey: 'Turkey' };

    let allActs = [];
    let cities = [];
    let cityInfo = {};
    let activeCity = cityParam || 'all';
    let showPlanned = false;

    function cityLabel(c) {
      return cityInfo[c] || COUNTRY_LABELS[c] || c;
    }

    function filteredActs() {
      let list = allActs;
      if (activeCity !== 'all') list = list.filter(a => a.city === activeCity);
      if (showPlanned)          list = list.filter(a => a.planned);
      return list;
    }

    function render() {
      const list = filteredActs();

      document.getElementById('filters-root').innerHTML = `
        <div class="filter-bar">
          <button class="filter-btn ${activeCity==='all'?'active':''}" data-city="all">All</button>
          ${cities.map(c => `
            <button class="filter-btn ${activeCity===c?'active':''}" data-city="${escHtml(c)}">
              ${escHtml(cityLabel(c))}
            </button>
          `).join('')}
          <button class="filter-btn ${showPlanned?'active':''}" id="filter-planned">Planned only</button>
          <span class="filter-count">${list.length} activit${list.length !== 1 ? 'ies' : 'y'}</span>
        </div>
      `;

      document.querySelectorAll('.filter-btn[data-city]').forEach(btn => {
        btn.addEventListener('click', () => { activeCity = btn.dataset.city; render(); });
      });
      document.getElementById('filter-planned')?.addEventListener('click', () => {
        showPlanned = !showPlanned; render();
      });

      const label = activeCity === 'all' ? '' : ` — ${cityLabel(activeCity)}`;
      document.getElementById('page-title').textContent = `Things to Do${label}`;

      if (!list.length) {
        document.getElementById('acts-root').innerHTML =
          `<div class="empty-state"><p>No activities match this filter.</p></div>`;
        return;
      }

      document.getElementById('acts-root').innerHTML = `
        <div class="act-grid">${list.map(renderAct).join('')}</div>
      `;
    }

    function renderAct(a) {
      const plannedBadge = a.planned
        ? '<span class="badge badge-planned" style="margin-left:0.4rem">Planned</span>' : '';

      // facts may be plain strings or {label?, text} objects
      const factsHtml = (a.facts || []).map(f => {
        const text  = typeof f === 'string' ? f : (f.text || '');
        const label = typeof f === 'object' && f.label ? f.label : '';
        return `
          <div class="act-fact">
            ${label ? `<span class="act-fact-label">${escHtml(label)}</span>` : ''}${escHtml(text)}
          </div>
        `;
      }).join('');

      // website may be top-level or nested under links
      const websiteUrl = a.website || (a.links && a.links.website);
      const websiteLink = websiteUrl
        ? `<a class="rest-link" href="${escHtml(websiteUrl)}" target="_blank" rel="noopener"
              style="display:inline-block;margin-top:0.75rem">Website →</a>`
        : '';

      // maps link
      const mapsUrl = a.links && a.links.maps;
      const mapsLink = mapsUrl
        ? `<a class="rest-link" href="${escHtml(mapsUrl)}" target="_blank" rel="noopener"
              style="display:inline-block;margin-top:0.75rem;margin-left:0.75rem">Map →</a>`
        : '';

      return `
        <div class="act-card ${a.planned ? 'planned' : ''}">
          <div class="act-name">${escHtml(a.name)}${plannedBadge}</div>
          ${a.visitNote ? `<div class="act-visit">${escHtml(a.visitNote)}</div>` : ''}
          ${a.address   ? `<div class="act-addr">${escHtml(a.address)}</div>` : ''}
          ${a.hours     ? `<div class="act-hours">${escHtml(a.hours)}</div>` : ''}
          ${a.fee       ? `<div class="act-fee">${escHtml(a.fee)}</div>` : ''}
          ${factsHtml   ? `<div class="act-facts">${factsHtml}</div>` : ''}
          ${(websiteLink || mapsLink) ? `<div class="rest-links">${websiteLink}${mapsLink}</div>` : ''}
        </div>
      `;
    }

    (async () => {
      if (!tripId) {
        document.getElementById('nav-root').innerHTML = renderNav();
        document.getElementById('acts-root').innerHTML =
          `<div class="empty-state"><p>No trip specified. <a href="index.html">All trips →</a></p></div>`;
        return;
      }

      const [trip, acts] = await Promise.all([fetchTrip(tripId), fetchActivities(tripId)]);

      if (!trip) {
        document.getElementById('nav-root').innerHTML = renderNav();
        document.getElementById('acts-root').innerHTML =
          `<div class="empty-state"><p>Trip not found.</p></div>`;
        return;
      }

      allActs = acts;
      cities = [...new Set(allActs.map(a => a.city))];
      for (const c of trip.cities || []) cityInfo[c.id] = c.name;

      document.title = `Activities — ${trip.title}`;
      document.getElementById('nav-root').innerHTML = renderNav(tripId, trip.title, 'activities');
      document.getElementById('kicker').innerHTML =
        `<a href="trip.html?id=${encodeURIComponent(tripId)}" style="color:inherit">${escHtml(trip.title)}</a>`;

      render();
    })();
  </script>
</body>
</html>
