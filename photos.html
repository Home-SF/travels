<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photos — Travels</title>
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .photo-item {
      position: relative;
      background: var(--bg-raised);
      border: 1.5px solid var(--rule);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }
    .photo-item:hover { box-shadow: var(--shadow-md); }
    .photo-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .photo-caption {
      padding: 0.4rem 0.6rem;
      font-size: 0.72rem;
      color: var(--ink-soft);
    }
    /* Delete button */
    .photo-delete-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      background: rgba(160, 0, 0, 0.78);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 0.78rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
      transition: background 0.15s;
    }
    .photo-delete-btn:hover { background: rgba(180, 0, 0, 1); }
    /* Sort control */
    .sort-select {
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border: 1.5px solid var(--rule);
      border-radius: 99px;
      background: var(--bg);
      color: var(--ink);
      cursor: pointer;
      font-family: inherit;
    }
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: var(--radius);
    }
    .lightbox-caption {
      color: #fff;
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.25rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.75rem;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div id="nav-root"></div>

  <main class="page-wrap">
    <div class="section-head">
      <span class="section-kicker" id="kicker">Photos</span>
      <h1>Photo Gallery</h1>
    </div>

    <div id="filters-root"></div>
    <div id="photos-root">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading photos…</p>
      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close" aria-label="Close">×</button>
    <img id="lb-img" src="" alt="" />
    <div class="lightbox-caption" id="lb-caption"></div>
  </div>

  <div id="footer-root"></div>

  <script type="module">
    import { app, db } from './assets/firebase-config.js';
    import { getParam, fetchTrip, renderNav, renderFooter, escHtml } from './assets/app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import { getStorage, ref as storageRef, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';
    import { collection, query, orderBy, getDocs, deleteDoc, doc }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    const tripId = getParam('trip');
    document.getElementById('footer-root').innerHTML = renderFooter();

    const auth    = getAuth(app);
    const storage = getStorage(app);

    let photos = [];
    let cityInfo = {};
    let cities = [];
    let activeCity = 'all';
    let sortOrder = 'date-asc'; // 'date-asc' | 'date-desc' | 'uploaded-desc'
    let authed = false;

    // Extract Firebase Storage path from a download URL
    function storagePathFromUrl(url) {
      try {
        const pathname = new URL(url).pathname; // /v0/b/BUCKET/o/ENCODED_PATH
        return decodeURIComponent(pathname.split('/o/')[1]);
      } catch (_) { return null; }
    }

    async function deletePhoto(photoId, photoUrl) {
      // Delete from Storage (ignore 404 — file may already be gone)
      const path = storagePathFromUrl(photoUrl);
      if (path) {
        try { await deleteObject(storageRef(storage, path)); } catch (e) {
          if (e.code !== 'storage/object-not-found') throw e;
        }
      }
      // Always delete the Firestore record
      await deleteDoc(doc(db, 'trips', tripId, 'photos', photoId));
      // Remove from local array
      photos = photos.filter(p => p.id !== photoId);
    }

    function sorted(list) {
      const copy = [...list];
      if (sortOrder === 'date-desc') {
        copy.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      } else if (sortOrder === 'uploaded-desc') {
        copy.sort((a, b) => {
          const ta = a.uploadedAt?.toMillis?.() ?? 0;
          const tb = b.uploadedAt?.toMillis?.() ?? 0;
          return tb - ta;
        });
      }
      return copy;
    }

    function filtered() {
      const base = activeCity === 'all' ? photos : photos.filter(p => p.city === activeCity);
      return sorted(base);
    }

    function render() {
      const list = filtered();

      document.getElementById('filters-root').innerHTML = `
        <div class="filter-bar">
          ${cities.length > 1 ? `
            <button class="filter-btn ${activeCity==='all'?'active':''}" data-city="all">All</button>
            ${cities.map(c => `
              <button class="filter-btn ${activeCity===c?'active':''}" data-city="${escHtml(c)}">
                ${escHtml(cityInfo[c] || c)}
              </button>
            `).join('')}
          ` : ''}
          <span class="filter-count">${list.length} photo${list.length!==1?'s':''}</span>
          <select class="sort-select" id="sort-select">
            <option value="date-asc"  ${sortOrder==='date-asc' ?'selected':''}>📅 Oldest first</option>
            <option value="date-desc" ${sortOrder==='date-desc'?'selected':''}>📅 Newest first</option>
            <option value="uploaded-desc" ${sortOrder==='uploaded-desc'?'selected':''}>🕐 Recently added</option>
          </select>
        </div>
      `;

      document.querySelectorAll('.filter-btn[data-city]').forEach(btn => {
        btn.addEventListener('click', () => { activeCity = btn.dataset.city; render(); });
      });
      document.getElementById('sort-select')?.addEventListener('change', e => {
        sortOrder = e.target.value; render();
      });

      if (!list.length) {
        document.getElementById('photos-root').innerHTML =
          `<div class="empty-state"><p>No photos yet.</p></div>`;
        return;
      }

      document.getElementById('photos-root').innerHTML = `
        <div class="photo-grid">
          ${list.map((p, i) => `
            <div class="photo-item" data-idx="${i}" data-id="${escHtml(p.id)}" data-url="${escHtml(p.url || p.thumbnailUrl)}">
              <img src="${escHtml(p.thumbnailUrl || p.url)}" alt="${escHtml(p.caption||'')}" loading="lazy"
                   onerror="this.closest('.photo-item').style.opacity='0.35'" />
              <button class="photo-delete-btn" title="Delete photo" style="display:${authed?'flex':'none'}">✕</button>
              ${p.caption ? `<div class="photo-caption">${escHtml(p.caption)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;

      document.querySelectorAll('.photo-item').forEach(el => {
        // Open lightbox on click (but not on delete button)
        el.addEventListener('click', e => {
          if (e.target.closest('.photo-delete-btn')) return;
          openLightbox(list[+el.dataset.idx]);
        });

        // Delete
        el.querySelector('.photo-delete-btn')?.addEventListener('click', async e => {
          e.stopPropagation();
          if (!confirm('Delete this photo? This cannot be undone.')) return;
          const btn = e.currentTarget;
          btn.disabled = true;
          btn.textContent = '…';
          try {
            await deletePhoto(el.dataset.id, el.dataset.url);
            render(); // re-render with updated photos array
          } catch (err) {
            console.error('Delete failed:', err);
            btn.textContent = '✕';
            btn.disabled = false;
            alert('Delete failed: ' + err.message);
          }
        });
      });
    }

    function openLightbox(photo) {
      document.getElementById('lb-img').src    = photo.url || photo.thumbnailUrl;
      document.getElementById('lb-img').alt    = photo.caption || '';
      document.getElementById('lb-caption').textContent =
        [photo.caption, photo.person, photo.date].filter(Boolean).join(' · ');
      document.getElementById('lightbox').classList.add('open');
    }

    document.getElementById('lb-close').addEventListener('click', () => {
      document.getElementById('lightbox').classList.remove('open');
    });
    document.getElementById('lightbox').addEventListener('click', e => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
    });

    // Show/hide delete buttons when auth state changes
    onAuthStateChanged(auth, user => {
      authed = !!user;
      document.querySelectorAll('.photo-delete-btn').forEach(btn => {
        btn.style.display = authed ? 'flex' : 'none';
      });
    });

    (async () => {
      if (!tripId) {
        document.getElementById('nav-root').innerHTML = renderNav();
        document.getElementById('photos-root').innerHTML =
          `<div class="empty-state"><p>No trip specified. <a href="index.html">All trips →</a></p></div>`;
        return;
      }

      const trip = await fetchTrip(tripId);
      if (!trip) {
        document.getElementById('nav-root').innerHTML = renderNav();
        document.getElementById('photos-root').innerHTML =
          `<div class="empty-state"><p>Trip not found.</p></div>`;
        return;
      }

      document.title = `Photos — ${trip.title}`;
      document.getElementById('nav-root').innerHTML = renderNav(tripId, trip.title, 'photos');
      document.getElementById('kicker').innerHTML =
        `<a href="trip.html?id=${encodeURIComponent(tripId)}" style="color:inherit">${escHtml(trip.title)}</a>`;

      const snap = await getDocs(
        query(collection(db, 'trips', tripId, 'photos'), orderBy('date', 'asc'))
      );
      photos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      for (const c of trip.cities || []) cityInfo[c.id] = c.name;
      cities = [...new Set(photos.map(p => p.city).filter(Boolean))];

      render();
    })();
  </script>
</body>
</html>
